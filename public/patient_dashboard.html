<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard | MyLifeAid</title>
    
    <link rel="stylesheet" href="./style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        /* A few fallback styles to ensure the popup looks good */
        #popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 999; display: none;
        }
    </style>
</head>
<body>

<header id="search-header">
    <!-- Hamburger Menu -->
    <div class="search-container">
        <button id="hamburger-btn" type="button" aria-label="Open sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-menu"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

    <aside id="sidebar">
        <button id="close-sidebar" type="button">&times;</button>
        <h2>Menu</h2>
        <nav>
            <a href="booking_history.html" style="color: black; text-decoration: none; padding: 10px; border-radius: 6px; font-weight:bold;">Booking History</a>
            <a href="#" id="logOutBtn" style="background-color: rgb(225, 57, 19); color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight:bold;">Log out</a>
        </nav>
    </aside>

    <div id="sidebar-overlay"></div>


        <!-- Search Bar -->
        <input
            id="search-bar"
            type="text"
            placeholder="Search for a hospital/clinic..."
        >

        <button id="filter-btn" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-filter"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        </button>
    </div>

    <div id="filter-dropdown" class="filter-drop">
        <button id="beds-filter" class="filter-btn">Beds</button>
        <button id="emergency-filter" class="filter-btn">Emergency Slots</button>
        <button id="distance-filter" class="filter-btn">Distance</button>
    </div>
</header>

  <!-- Map container -->
  <div id="map" style="height: 400px; width: 100%;"></div>

  <!--Bottom sheet-->
  <div id="container">
      <!--Hospital/Clinic Cards-->
      <div id="cards-container">
          <p style="text-align: center;">Loading nearby healthcare facilities...</p>
      </div>
  </div>

  <div id="popup-overlay"></div>

  <!-- Leaflet JavaScript (without integrity check) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ================= FIREBASE & LOGIC ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABwRJyK5SdeC4FM0jTbnVbiV4hU3TXB6I",
      authDomain: "mylaid-f9947.firebaseapp.com",
      projectId: "mylaid-f9947",
      storageBucket: "mylaid-f9947.firebasestorage.app",
      messagingSenderId: "315125553793",
      appId: "1:315125553793:web:af4ac3618e0531fa190b80"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ================= GLOBAL VARIABLES =================
    let allHospitals = [];
    let mapMarkers = [];
    let userLat = null;
    let userLng = null;
    let marker, circle, zoomed;
    let map;
    let activeSort = null; 

    // ================= INITIALIZE MAP =================
    function initializeMap() {
        try {
            map = L.map('map').setView([-26.2041, 28.0473], 12); // Default to Johannesburg
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            console.log("Map initialized successfully");
        } catch (error) {
            console.error("Error initializing map:", error);
        }
    }

    const genericIcon = L.icon({
        iconUrl: 'images/generic.png',
        iconSize: [30, 30]
    });

    // ================= GEOLOCATION =================
    function handleGeolocationSuccess(position) {
        try {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            if (marker) {
                map.removeLayer(marker);
                map.removeLayer(circle);
            }

            marker = L.marker([userLat, userLng]).addTo(map).bindPopup("<b>You are here</b>");
            circle = L.circle([userLat, userLng], {radius: accuracy}).addTo(map);

            if (!zoomed) {
                zoomed = map.fitBounds(circle.getBounds());
                if(allHospitals.length > 0) {
                    calculateDistances();
                    if (activeSort === 'beds') {
                        handleBedsFilter();
                    } else if (activeSort === 'emergency') {
                        handleEmergencyFilter();
                    } else if (activeSort === 'distance') {
                        handleDistanceFilter();
                    } else {
                        const searchInput = document.getElementById("search-bar");
                        if (searchInput && searchInput.value) {
                            handleSearchInput({ target: searchInput });
                        } else {
                            renderHospitals(allHospitals);
                        }
                    }
                }
            }
        } catch (error) {
            console.error("Error in geolocation success:", error);
        }
    }

    function handleGeolocationError(err) {
        try {
            if (err.code === 1) {
                console.warn("Location access denied.");
            } else {
                console.warn("Unable to retrieve location.");
            }
        } catch (error) {
            console.error("Error in geolocation error handler:", error);
        }
    }

    navigator.geolocation.watchPosition(handleGeolocationSuccess, handleGeolocationError);

    // Haversine formula to calculate distance in km
    function getDistance(lat1, lon1, lat2, lon2) {
        try {
            if(!lat1 || !lon1 || !lat2 || !lon2) return Infinity;
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return parseFloat((R * c).toFixed(1));
        } catch (error) {
            console.error("Error calculating distance:", error);
            return Infinity;
        }
    }

    function calculateDistances() {
        try {
            allHospitals.forEach(function(h) {
                if(userLat && userLng) {
                    h.distance = getDistance(userLat, userLng, h.lat, h.lng);
                } else {
                    h.distance = Infinity; 
                }
            });
        } catch (error) {
            console.error("Error calculating distances:", error);
        }
    }

    // ================= FETCH DATA =================
    function fetchHospitals() {
        try {
            onSnapshot(collection(db, "healthcare_services"), function(querySnapshot) {
                allHospitals = [];
                
                querySnapshot.forEach(function(doc) {
                    try {
                        const data = doc.data();
                        allHospitals.push({
                            id: doc.id,
                            name: data.name || "Unknown Facility",
                            address: data.address || "Address not provided",
                            phone: data.phone || "No phone",
                            tawkto: data.tawkto || "",
                            lat: parseFloat(data.lat),
                            lng: parseFloat(data.lng),
                            type: data.type || "Hospital",
                            email: data.email || "",
                            bedsAvailable: data.bedsAvailable || 0,
                            emergencySlotsAvailable: data.emergencySlotsAvailable || 0,
                            booking: data.booking || 0,
                            bookings: data.bookings || 0,
                            description: data.description || data.type + " located in your area.",
                            rating: data.rating || 0,
                            url: "images/generic.png", 
                            distance: Infinity,
                            schedule: data.schedule || null // Fetch schedule directly from DB
                        });
                    } catch (error) {
                        console.error("Error processing hospital document:", error);
                    }
                });

                calculateDistances();
                
                if (activeSort === 'beds') {
                    handleBedsFilter();
                } else if (activeSort === 'emergency') {
                    handleEmergencyFilter();
                } else if (activeSort === 'distance') {
                    handleDistanceFilter();
                } else {
                    const searchInput = document.getElementById("search-bar");
                    if (searchInput && searchInput.value) {
                        handleSearchInput({ target: searchInput });
                    } else {
                        renderHospitals(allHospitals);
                    }
                }

            }, function(error) {
                console.error("Error fetching hospitals:", error);
                document.getElementById('cards-container').innerHTML = "<p>Error loading facilities.</p>";
            });

        } catch (error) {
            console.error("Error setting up snapshot:", error);
            document.getElementById('cards-container').innerHTML = "<p>Error loading facilities.</p>";
        }
    }

    // ================= RENDER UI & MAP PINS =================
    function renderHospitals(list) {
        try {
            const cardsContainer = document.getElementById("cards-container");
            cardsContainer.innerHTML = "";

            // Clear existing hospital map markers
            mapMarkers.forEach(function(m) {
                try {
                    map.removeLayer(m);
                } catch (error) {
                    console.error("Error removing marker:", error);
                }
            });
            mapMarkers = [];

            if(list.length === 0) {
                cardsContainer.innerHTML = "<p>No facilities found.</p>";
                return;
            }

            list.forEach(function(hospital) {
                try {
                    // 1. Create Card
                    const card = document.createElement("div");
                    card.className = "card";
                    card.style.display = "flex";
                    card.style.justifyContent = "space-between";
                    card.style.alignItems = "center";
                    card.style.gap = "15px"; 
                    card.style.fontFamily = "'Space Grotesk', sans-serif";
                    card.style.background = "#fff";
                    card.style.padding = "15px";
                    card.style.marginBottom = "15px";
                    card.style.borderRadius = "8px";
                    card.style.boxShadow = "0 4px 6px rgba(0,0,0,0.05)";
                    card.style.cursor = "pointer";

                    const distanceText = hospital.distance === Infinity ? "Calculating..." : hospital.distance + " km";

                    card.innerHTML = `
                        <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; overflow-wrap: break-word;">
                            <h3 style="color:#1D4352; margin:0; line-height: normal; height: auto;">${hospital.name.length > 13 ? hospital.name.substring(0, 13) + "..." : hospital.name}</h3>
                            <p style="font-size:20px; color:#666; margin:0; line-height: normal; height: auto;"><strong>Address:</strong> ${hospital.address.length > 13 ? hospital.address.substring(0, 13) + "..." : hospital.address}</p>
                            <p style="font-size:20px; color:#666; margin:0; line-height: normal; height: auto;"><strong>Booked:</strong> ${hospital.booking || 0}</p>
                            <p style="font-size:20px; color:#666; margin:0; line-height: normal; height: auto;"><strong>Beds Available:</strong> ${hospital.bedsAvailable || 0}</p>
                            <p style="font-size:20px; color:#666; margin:0; line-height: normal; height: auto;"><strong>Emergency Slots:</strong> ${hospital.emergencySlotsAvailable || 0}</p>
                            <p style="font-size:20px; color:#e74c3c; font-weight:600; margin:0; line-height: normal; height: auto;"><strong>Distance:</strong> ${distanceText}</p>
                        </div>
                        <img src='${hospital.url}' alt='Hospital' width='90' height='90' style="border-radius:6px; object-fit:cover; flex-shrink: 0; align-self: flex-start;">
                    `;

                    // Open Popup on Click
                    card.addEventListener("click", function() {
                        try {
                            openHospitalPopup(hospital);
                        } catch (error) {
                            console.error("Error opening hospital popup:", error);
                        }
                    });
                    cardsContainer.appendChild(card);

                    // 2. Add Map Marker
                    if(hospital.lat && hospital.lng) {
                        try {
                            const hMarker = L.marker([hospital.lat, hospital.lng], { icon: genericIcon }).addTo(map);
                            hMarker.bindPopup(`
                                <strong>${hospital.name}</strong><br>
                                ${hospital.address}<br>
                                ${hospital.phone}<br><br>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${hospital.lat},${hospital.lng}">Get Directions →</a>
                            `);
                            
                            hMarker.on('click', function() {
                                try {
                                    map.setView([hospital.lat, hospital.lng], 15);
                                } catch (error) {
                                    console.error("Error setting map view:", error);
                                }
                            });

                            mapMarkers.push(hMarker);
                        } catch (error) {
                            console.error("Error adding marker:", error);
                        }
                    }
                } catch (error) {
                    console.error("Error rendering hospital card:", error);
                }
            });
        } catch (error) {
            console.error("Error in renderHospitals:", error);
        }
    }

    // ================= POPUP & BOOKING LOGIC =================
    function openHospitalPopup(hospital) {
        try {
            document.getElementById('popup-overlay').style.display = 'block';

            const popUp = document.createElement("div");
            popUp.id = "hospital-popup-box";
            popUp.style.position = "fixed";
            popUp.style.width = "90%";
            popUp.style.maxWidth = "450px";
            popUp.style.top = "50%";
            popUp.style.left = "50%";
            popUp.style.transform = "translate(-50%, -50%)";
            popUp.style.background = "#1D4352";
            popUp.style.padding = "20px";
            popUp.style.boxShadow = "0 4px 15px rgba(0,0,0,0.5)";
            popUp.style.zIndex = "1000";
            popUp.style.maxHeight = "85vh";
            popUp.style.overflowY = "auto";
            popUp.style.borderRadius = "12px";
            popUp.style.color = "white";

            popUp.innerHTML = `
                <button id='close-popup' style='float:right; font-size:20px; background:none; border:none; color:white; cursor:pointer;'>✖</button>
                <h3 style='margin-bottom: 10px;'>${hospital.name}</h3>
                
                <div style="display:flex; gap:10px; margin-bottom: 15px;">
                    <a style='flex:1; text-align:center; background-color: #2ecc71; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight:bold;' href='tel:${hospital.phone}'>Call Facility</a>
                    <button id='showFormBtn' style='flex:1; background-color: #3498db; color: white; border: none; padding: 10px; border-radius: 6px; font-weight:bold; cursor:pointer;'>Book</button>
                    <button id='tawktoBtn' style='flex:1; background-color: #e67e22; color: white; border: none; padding: 10px; border-radius: 6px; font-weight:bold; cursor:pointer;' onclick="window.location.href='${hospital.tawkto}'">Chat</button>
                </div>

                <form id='hospital-form' style="display: none; background-color: #fff; color:#333; padding: 15px; border-radius: 8px;">
                    <h3 style="color:#1D4352; margin-bottom:15px; border-bottom: 2px solid #eee; padding-bottom:5px;">Patient Details</h3>
                    
                    <label>First Name</label>
                    <input type="text" name="firstName" required style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;">
                    
                    <label>Surname</label>
                    <input type="text" name="surname" required style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;">
                    
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;">
                    
                    <label>Preferred Date</label>
                    <input type="date" id="bookDate" name="appointmentDate" required style="width:100%; padding:8px; margin-bottom:5px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;">
                    <p id="schedule-hint" style="font-size:12px; color:#e74c3c; margin-top:0px; margin-bottom:10px; min-height:15px;"></p>
                    
                    <label>Preferred Time</label>
                    <input type="time" id="bookTime" name="appointmentTime" required disabled style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;">

                    <label>Reason for visit</label>
                    <textarea name="reason" required style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;"></textarea>

                    <button type="submit" id="submitBookingBtn" style="width:100%; background-color: #1D4352; color: white; border: none; padding: 12px; border-radius: 6px; font-size:16px; font-weight:bold; cursor:pointer;">Submit Request</button>
                </form>
            `;

            document.body.appendChild(popUp);

            // Set minimum date to today
            const dateInput = document.getElementById('bookDate');
            const timeInput = document.getElementById('bookTime');
            const scheduleHint = document.getElementById('schedule-hint');
            
            const todayStr = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', todayStr);

            // Handle Schedule/Date Changes
            dateInput.addEventListener('change', function(e) {
                // Ensure date parses locally to avoid UTC offset issues
                const selectedDate = new Date(e.target.value + 'T00:00:00'); 
                const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const dayName = daysOfWeek[selectedDate.getDay()];
                
                const schedule = hospital.schedule ? hospital.schedule[dayName] : null;

                if (schedule) {
                    if (schedule.closed) {
                        scheduleHint.innerText = "Facility is closed on " + dayName + "s.";
                        scheduleHint.style.color = "#e74c3c";
                        timeInput.disabled = true;
                        timeInput.value = "";
                        timeInput.removeAttribute('min');
                        timeInput.removeAttribute('max');
                    } else {
                        const openTime = schedule.open || "00:00";
                        const closeTime = schedule.close || "23:59";
                        scheduleHint.innerText = "Hours for " + dayName + ": " + openTime + " - " + closeTime;
                        scheduleHint.style.color = "#2ecc71";
                        timeInput.disabled = false;
                        timeInput.setAttribute('min', openTime);
                        timeInput.setAttribute('max', closeTime);
                    }
                } else {
                    scheduleHint.innerText = "No specific schedule found. Subject to general availability.";
                    scheduleHint.style.color = "#666";
                    timeInput.disabled = false;
                    timeInput.removeAttribute('min');
                    timeInput.removeAttribute('max');
                }
            });

            // Validate time input strictly against schedule limits
            timeInput.addEventListener('change', function(e) {
                const selectedTime = e.target.value;
                const minTime = timeInput.getAttribute('min');
                const maxTime = timeInput.getAttribute('max');
                
                if (minTime && maxTime) {
                    if (selectedTime < minTime || selectedTime > maxTime) {
                        alert("Please select a time within the facility's operating hours (" + minTime + " - " + maxTime + ").");
                        e.target.value = "";
                    }
                }
            });

            // Close logic
            document.getElementById('close-popup').onclick = function() {
                try {
                    document.body.removeChild(popUp);
                    document.getElementById('popup-overlay').style.display = 'none';
                } catch (error) {
                    console.error("Error closing popup:", error);
                }
            };

            // Toggle Form
            document.getElementById('showFormBtn').onclick = function() {
                try {
                    const form = document.getElementById('hospital-form');
                    form.style.display = form.style.display === 'none' ? 'block' : 'none';
                } catch (error) {
                    console.error("Error toggling form:", error);
                }
            };

            // Handle Submission
            document.getElementById('hospital-form').addEventListener('submit', async function(e) {
                try {
                    e.preventDefault();
                    
                    // Double check time validity right before submission
                    const selectedTime = timeInput.value;
                    const minTime = timeInput.getAttribute('min');
                    const maxTime = timeInput.getAttribute('max');
                    if (minTime && maxTime && (selectedTime < minTime || selectedTime > maxTime)) {
                        alert("Invalid time selected. Please select a time between " + minTime + " and " + maxTime + ".");
                        return;
                    }

                    const submitBtn = document.getElementById('submitBookingBtn');
                    submitBtn.innerText = "Submitting...";
                    submitBtn.disabled = true;
                    
                    const user = auth.currentUser;

                    const formData = new FormData(e.target);
                    const bookingData = Object.fromEntries(formData.entries());
                    bookingData.status = "Pending";
                    bookingData.createdAt = new Date().toISOString();
                    bookingData.userId = user.uid;

                    try {
                        // Save inside the specific hospital's 'bookings' subcollection
                        await addDoc(collection(db, "healthcare_services", hospital.id, "bookings"), bookingData);

                        await updateDoc(doc(db, "healthcare_services", hospital.id), {
                            booking: increment(1)
                        });
                        
                        alert("Appointment request submitted successfully!");
                        try {
                            document.body.removeChild(popUp);
                        } catch (error) {
                            console.error("Error removing popup:", error);
                        }
                        document.getElementById('popup-overlay').style.display = 'none';
                    } catch (firebaseError) {
                        console.error("Error submitting booking:", firebaseError);
                        alert("Failed to submit request. Please try again.");
                        submitBtn.innerText = "Submit Request";
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    console.error("Error in form submission:", error);
                    alert("An error occurred. Please try again.");
                }
            });
        } catch (error) {
            console.error("Error opening hospital popup:", error);
            alert("Failed to open hospital details.");
        }
    }

    // ================= SEARCH & FILTERS =================
    function handleSearchInput(e) {
        try {
            if (activeSort === 'beds') {
                handleBedsFilter();
            } else if (activeSort === 'emergency') {
                handleEmergencyFilter();
            } else if (activeSort === 'distance') {
                handleDistanceFilter();
            } else {
                const text = e.target.value.toLowerCase();
                if (text === "") {
                    renderHospitals(allHospitals);
                    return;
                }
                const filtered = allHospitals.filter(function(h) {
                    return h.name.toLowerCase().includes(text) || h.address.toLowerCase().includes(text);
                });
                renderHospitals(filtered);
            }
        } catch (error) {
            console.error("Error in search:", error);
        }
    }

    function handleFilterButtonClick() {
        try {
            const filterDropdown = document.getElementById('filter-dropdown');
            filterDropdown.style.display = filterDropdown.style.display === 'block' ? 'none' : 'block';
        } catch (error) {
            console.error("Error toggling filter dropdown:", error);
        }
    }

    function handleBedsFilter() {
        try {
            activeSort = 'beds';
            const text = document.getElementById("search-bar").value.toLowerCase();
            let list = allHospitals;
            if (text !== "") {
                list = allHospitals.filter(function(h) {
                    return h.name.toLowerCase().includes(text) || h.address.toLowerCase().includes(text);
                });
            }
            const sorted = list.slice().sort(function(a, b) {
                return (b.bedsAvailable || 0) - (a.bedsAvailable || 0);
            });
            renderHospitals(sorted);
        } catch (error) {
            console.error("Error in beds filter:", error);
        }
    }

    function handleEmergencyFilter() {
        try {
            activeSort = 'emergency';
            const text = document.getElementById("search-bar").value.toLowerCase();
            let list = allHospitals;
            if (text !== "") {
                list = allHospitals.filter(function(h) {
                    return h.name.toLowerCase().includes(text) || h.address.toLowerCase().includes(text);
                });
            }
            const sorted = list.slice().sort(function(a, b) {
                return (b.emergencySlotsAvailable || 0) - (a.emergencySlotsAvailable || 0);
            });
            renderHospitals(sorted);
        } catch (error) {
            console.error("Error in emergency filter:", error);
        }
    }

    function handleDistanceFilter() {
        try {
            activeSort = 'distance';
            calculateDistances();
            const text = document.getElementById("search-bar").value.toLowerCase();
            let list = allHospitals;
            if (text !== "") {
                list = allHospitals.filter(function(h) {
                    return h.name.toLowerCase().includes(text) || h.address.toLowerCase().includes(text);
                });
            }
            const sorted = list.slice().sort(function(a, b) {
                if (a.distance === Infinity && b.distance === Infinity) return 0;
                if (a.distance === Infinity) return 1;
                if (b.distance === Infinity) return -1;
                return a.distance - b.distance;
            });
            renderHospitals(sorted);
        } catch (error) {
            console.error("Error in distance filter:", error);
        }
    }

    // Attach event listeners
    try {
        document.getElementById("search-bar").addEventListener("input", handleSearchInput);
        document.getElementById("filter-btn").addEventListener("click", handleFilterButtonClick);
        document.getElementById("beds-filter").addEventListener("click", handleBedsFilter);
        document.getElementById("emergency-filter").addEventListener("click", handleEmergencyFilter);
        document.getElementById("distance-filter").addEventListener("click", handleDistanceFilter);
    } catch (error) {
        console.error("Error attaching event listeners:", error);
    }

    // ================= LOGOUT =================
    function handleLogout() {
        try {
            signOut(auth).then(function() {
                window.location.replace("index.html");
            }).catch(function(error) {
                console.error("Logout Error:", error);
                alert("Error logging out. Please try again.");
            });
        } catch (error) {
            console.error("Error in logout:", error);
        }
    }

    try {
        document.getElementById('logOutBtn').addEventListener('click', handleLogout);
    } catch (error) {
        console.error("Error attaching logout listener:", error);
    }

    // ================= INITIALIZE APP =================
    try {
        initializeMap();
        fetchHospitals();
    } catch (error) {
        console.error("Error initializing app:", error);
    }

    // ================= SIDEBAR LOGIC =================
    const hamburgerBtn = document.getElementById("hamburger-btn");
    const sidebar = document.getElementById("sidebar");
    const closeSidebar = document.getElementById("close-sidebar");
    const sidebarOverlay = document.getElementById("sidebar-overlay");

    hamburgerBtn.addEventListener("click", function () {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("open");
        hamburgerBtn.setAttribute("aria-label", "Close sidebar");
    });

    function closeSidebarMenu() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
        hamburgerBtn.setAttribute("aria-label", "Open sidebar");
    }

    closeSidebar.addEventListener("click", closeSidebarMenu);
    sidebarOverlay.addEventListener("click", closeSidebarMenu);

  </script>
</body>
</html>
