name: iOS Capacitor Build
on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install && npx cap sync ios
      - run: cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v3
        with:
          name: ios-unsigned-build
          path: ios/App/build/